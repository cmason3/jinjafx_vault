on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - run: |
          go version
          go mod tidy

      - run: |
          env GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o jinjafx_vault -ldflags="-s -w" -trimpath main.go
          tar zcvf jinjafx_vault-${{ github.ref_name }}-linux-amd64.tar.gz jinjafx_vault

      - run: |
          env GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o jinjafx_vault -ldflags="-s -w" -trimpath main.go
          tar zcvf jinjafx_vault-${{ github.ref_name }}-macos-amd64.tar.gz jinjafx_vault

      - run: |
          env GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o jinjafx_vault -ldflags="-s -w" -trimpath main.go
          tar zcvf jinjafx_vault-${{ github.ref_name }}-macos-arm64.tar.gz jinjafx_vault

      - run: |
          env GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o jinjafx_vault.exe -ldflags="-s -w" -trimpath main.go
          zip jinjafx_vault-${{ github.ref_name }}-windows-x86_64.zip jinjafx_vault.exe

      - uses: softprops/action-gh-release@v3
        with:
          name: JinjaFx Vault ${{ github.ref_name }}
          body: '[CHANGELOG](CHANGELOG.md)'
          files: |
            jinjafx_vault-${{ github.ref_name }}-linux-amd64.tar.gz
            jinjafx_vault-${{ github.ref_name }}-macos-amd64.tar.gz
            jinjafx_vault-${{ github.ref_name }}-macos-arm64.tar.gz
            jinjafx_vault-${{ github.ref_name }}-windows-x86_64.zip
