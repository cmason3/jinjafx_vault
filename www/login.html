<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <title>JinjaFx Vault</title>
    <link rel="icon" type="image/png" href="{{.Version}}/img/favicon.png" />
    <link rel="stylesheet" href="{{.Version}}/css/bootstrap.min.css" />
  </head>
  <body>
    <div id="login" class="modal fade" data-bs-backdrop="static" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title">Vault Login</h4>
          </div>
          <div class="modal-body p-4">
            <div class="row">
              <label class="form-label fw-bold" for="loginUser">User</label>
              <input id="loginUser" class="form-control" autocomplete="username">
            </div><br />
            <div class="row">
              <label class="form-label fw-bold" for="loginPassword">Password</label>
              <input id="loginPassword" type="password" class="form-control" autocomplete="current-password">
            </div>
          </div>
          <div class="modal-footer">
            <button id="submit" class="btn btn-primary" type="button">Login</button>
          </div>
        </div>
      </div>
    </div>
    <div id="error" class="modal modal-lg fade" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-danger">              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <h5 class="modal-title text-danger">&nbsp;Error</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <span id="status" class="text-danger"></span>
          </div>
        </div>
      </div>
    </div>
    <script src="{{.Version}}/js/bootstrap.bundle.min.js"></script>
    <script src="{{.Version}}/js/login.js"></script>
  </body>
</html>
